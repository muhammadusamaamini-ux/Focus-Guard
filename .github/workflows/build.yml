name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        run: gradle assembleRelease --no-daemon -PbuildNumber=${{ github.run_number }}

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk FocusGuard.apk

      - name: Publish to Releases (download from your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Focus Guard (build ${{ github.run_number }})
          body: Download FocusGuard.apk below and open it on your phone to install.
          files: FocusGuard.apk
          make_latest: true
