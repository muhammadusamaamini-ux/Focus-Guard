plugins {
    id 'com.android.application'
}

android {
    namespace 'com.usama.focusguard'
    compileSdk 34

    defaultConfig {
        applicationId 'com.usama.focusguard'
        minSdk 24
        targetSdk 34
        // GitHub passes its build number here, so "Check for updates" can compare versions.
        def buildNumber = (project.findProperty('buildNumber') ?: '1').toString().toInteger()
        versionCode buildNumber
        versionName "build " + buildNumber
    }

    // Fixed signing key, so every new build installs over the old one.
    signingConfigs {
        debug {
            storeFile file('focusguard.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
